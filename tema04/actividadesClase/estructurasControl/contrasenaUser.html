<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo contraseña</title>
</head>
<body>
    <h1>Contraseña</h1>

    <script>

        var passwd = prompt("Introduce la contraseña", "Contraseña");

        if(passwd="A")
        {
            alert("Contraseña correcta");
        }

        else
        {
            alert("Contarseña no correcta: [" + passwd + "]");
        }

        

    </script>
</body>
</html>
