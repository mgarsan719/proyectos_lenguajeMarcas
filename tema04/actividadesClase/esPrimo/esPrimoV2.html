<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Números Primos</title>
  <style>
    /* Un poco de estilo para que no sea solo texto plano */
    body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #f4f4f9; }
    .contenedor { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #resultado { margin-top: 1.5rem; font-weight: bold; text-align: center; min-height: 1.2em; }
    .es-primo { color: #28a745; }
    .no-es-primo { color: #dc3545; }
  </style>
</head>
<body>

<div class="contenedor">
  <h2>¿Es Primo?</h2>
  <form id="formularioPrimos">
    <label for="numeroInput">Introduce un número:</label>
    <input type="number" id="numeroInput" placeholder="Ej: 17" required>
    <button type="submit">Verificar ahora</button>
  </form>

  <div id="resultado"></div>
</div>

<script>
  // Lógica de cálculo
  function esNumeroPrimo(valor) {
    if (valor <= 1) return false;
    for (let divisor = 2; divisor <= Math.sqrt(valor); divisor++) {
      if (valor % divisor === 0) return false;
    }
    return true;
  }

  // Manejo del formulario
  const formulario = document.getElementById('formularioPrimos');
  const cuadroResultado = document.getElementById('resultado');

  formulario.addEventListener('submit', function(evento) {
    evento.preventDefault(); // Evita que la página se recargue al enviar
    
    const input = document.getElementById('numeroInput');
    const numeroCasteado = parseInt(input.value);

    if (isNaN(numeroCasteado)) {
      cuadroResultado.textContent = "Por favor, escribe un número.";
      cuadroResultado.className = "";
      return;
    }

    const resultadoFinal = esNumeroPrimo(numeroCasteado);
    
    // Mostramos el resultado visualmente
    if (resultadoFinal) {
      cuadroResultado.textContent = `✅ El ${numeroCasteado} es primo.`;
      cuadroResultado.className = "es-primo";
    } else {
      cuadroResultado.textContent = `❌ El ${numeroCasteado} no es primo.`;
      cuadroResultado.className = "no-es-primo";
    }
  });
</script>

</body>
</html>
