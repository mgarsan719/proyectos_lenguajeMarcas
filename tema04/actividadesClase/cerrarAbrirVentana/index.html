<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function inicializar() {
            document.getElementById("crear-ventana").onclick = crearVentana;
            document.getElementById("cerrar-ventana").onclick = cerrarVentana;
        }

        let miVentana= null;
        function crearVentana() {
            miVentana = window.open("https://www.w3c.es/", "_blank", "height=600, width=800");
        }

        function cerrarVentana() {
            if(miVentana) {
                miVentana.close();
                miVentana = null;
            }
        }
    </script>
</head>
<body onload="inicializar();">
    <h1>Cerrar y abrir ventana</h1>
    <form>
        <input type="button" id="crear-ventana" value="Crear ventana">
        <input type="button" id="cerrar-ventana" value="Cerrar ventana">
    </form>
</body>
</html>
