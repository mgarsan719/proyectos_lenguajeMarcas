<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificación - Tolea</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid black;
        }
        /* Estilos para la cabecera */
        th {
            background-color: red;
            color: black;
            text-decoration: underline;
            font-weight: bold;
            padding: 10px;
        }
        /* Filas Impares (Parte A) */
        tbody tr:nth-child(odd) {
            background-color: #660033;
            color: #FFFFFF;
        }
        /* Filas Pares (Parte A) */
        tbody tr:nth-child(even) {
            background-color: #000000;
            color: #6F6F6F;
        }
        td {
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body bgcolor="blue">
    <table>
        <thead>
            <tr>
                <th colspan="3">Clasificación</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Senoel</td>
                <td>1 - 5</td>
                <td>Sergit</td>
            </tr>
            <tr>
                <td>Agutrot</td>
                <td>0 - 11</td>
                <td>Seipneic</td>
            </tr>
            <tr>
                <td>Ojergnac</td>
                <td>15 - 15</td>
                <td>Zurtseva</td>
            </tr>
            <tr>
                <td>Setnomatlas</td>
                <td>9 - 8</td>
                <td>Aguro</td>
            </tr>
            <tr>
                <td>Adimoc</td>
                <td>0 - 0</td>
                <td>Satap</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
